# Zeabur 部署配置
# 文件: zeabur.yaml

services:
  # ===========================================
  # Polymarket Copy Trader 服务
  # ===========================================
  - name: copy-trader
    type: docker
    dockerfile: Dockerfile
    env:
      # 必填项
      TARGET_WALLET: "0xf418d3a1a941292f9c8707d62a14980c5beb95a3"
      COPY_TRADE_AMOUNT: "20"
      MAX_SLIPPAGE: "0.15"
      MIN_REMAINING_TIME: "30"
      RUST_LOG: "info"

    volumes:
      - name: copy-trader-data
        mountPath: /app/data

    # 环境变量（需要在 Zeabur 控制台手动设置）
    # POLYGON_WS_URL: wss://polygon-mainnet.g.alchemy.com/v2/YOUR_KEY
    # PRIVATE_KEY: your_private_key_here
