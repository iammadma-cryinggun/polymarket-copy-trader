[package]
name = "polymarket-copy-trader"
version = "0.1.0"
edition = "2021"
description = "Real-time copy trading bot for Polymarket via Polygon RPC WebSocket"
authors = ["Martin <martin@example.com>"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Blockchain
alloy = { version = "1", default-features = false, features = [
    "provider-ws",
    "provider-http",
    "signer-local",
    "rpc-types-eth",
    "sol-types",
] }

# Polymarket SDK - CLOB V2 (2026-04-28 起 V1 SDK 已无法下单，"invalid order version")
polymarket_client_sdk_v2 = { version = "0.7", features = ["clob"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Error handling
anyhow = "1"
thiserror = "1"

# File locking (single-instance guard)
fs2 = "0.4"

# Config
dotenv = "0.15"

# HTTP client
reqwest = { version = "0.12", features = ["json"] }

# UUID
uuid = { version = "1", features = ["v4"] }

# Decimal
rust_decimal = "1"
rust_decimal_macros = "1"

[profile.release]
opt-level = 3
lto = true
