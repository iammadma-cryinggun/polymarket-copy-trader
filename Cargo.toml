[package]
name = "polymarket-copy-trader"
version = "0.1.0"
edition = "2021"
description = "Real-time copy trading bot for Polymarket via Polygon RPC WebSocket"
authors = ["Martin <martin@example.com>"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Blockchain (alloy for Polygon RPC WebSocket)
alloy = { git = "https://github.com/alloy-rs/alloy", tag = "v0.4.0", features = [
    "provider-ws",
    "signer-local",
    "rpc-types-eth",
    "sol-types",
] }

# Polymarket SDK (官方仓库)
polymarket-client-sdk = { git = "https://github.com/polymarket/rs-clob-client", tag = "v0.4.4" }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async utilities
futures = "0.3"
async-trait = "0.1"

# Error handling
anyhow = "1"
thiserror = "1"

# Config
dotenv = "0.15"

# HTTP client (for CLOB API)
reqwest = { version = "0.12", features = ["json"] }

# UUID (for order IDs)
uuid = { version = "1", features = ["v4"] }

[profile.release]
opt-level = 3
lto = true
